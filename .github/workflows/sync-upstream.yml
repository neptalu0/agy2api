name: Sync Upstream (su-kaka/gcli2api)

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch and Merge Upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add upstream remote
          git remote add upstream https://github.com/su-kaka/gcli2api.git || true
          git fetch upstream master

          # Ensure we are on master
          git checkout master

          # Check if there are changes from upstream (ignoring this workflow file)
          if git diff --quiet HEAD upstream/master -- ':!.github/workflows/sync-upstream.yml'; then
            echo "Already up-to-date with upstream (no new changes)."
            exit 0
          fi

          echo "New changes found in upstream. Merging..."
          # Merge favoring upstream changes on any conflict, and skip CI to prevent loop
          git merge upstream/master -X theirs -m "chore: sync upstream [skip ci]"

          # Push changes back to fork
          git push origin master
